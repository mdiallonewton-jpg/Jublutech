<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — JubluTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
<div class="wrap header-inner">
<a href="index.html" class="logo">Jublu<span>Tech</span></a>
</div>
</header>

<main>
<section class="section auth-section">

  <div class="curtain" aria-hidden="true"></div>

  <div class="wrap auth-wrap">
    <div class="auth-intro" id="authIntro">

      <div class="intro-character" id="introCharacter" aria-hidden="true">
        <svg class="figure-solid" viewBox="0 0 60 120" width="100" height="200">
          <g class="leg-l"><line x1="24" y1="74" x2="18" y2="112"/></g>
          <g class="leg-r"><line x1="36" y1="74" x2="42" y2="112"/></g>
          <rect class="body" x="18" y="32" width="24" height="42" rx="12"/>
          <g class="arm-l"><line x1="20" y1="38" x2="6" y2="60"/></g>
          <g class="arm-r-group">
            <line class="arm-r" x1="40" y1="38" x2="54" y2="60"/>
            <circle class="hand-r" cx="54" cy="60" r="5"/>
          </g>
          <circle class="head" cx="30" cy="16" r="12"/>
        </svg>
      </div>

      <div class="pull-rope" aria-hidden="true"></div>

      <div class="auth-card" id="authCard">
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab is-active" data-tab="login" role="tab" aria-selected="true">Connexion</button>
          <button class="auth-tab" data-tab="signup" role="tab" aria-selected="false">Créer un compte</button>
        </div>

        <!-- Connexion -->
        <form id="login-form" class="contact-form auth-form" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="login-password">Mot de passe</label>
            <input type="password" id="login-password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary">Se connecter</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>

        <!-- Inscription -->
        <form id="signup-form" class="contact-form auth-form" novalidate hidden>
          <div class="field">
            <label for="signup-nom">Nom complet</label>
            <input type="text" id="signup-nom" required autocomplete="name">
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="signup-password">Mot de passe</label>
            <input type="password" id="signup-password" required minlength="6" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary">Créer mon compte</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>

    </div>
  </div>
</section>
</main>

<footer class="site-footer">
<div class="wrap footer-inner">
<span class="logo">Jublu<span>Tech</span></span>
<p>© <span id="year"></span> JubluTech</p>
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  var intro = document.getElementById('authIntro');
  var character = document.getElementById('introCharacter');
  if (!intro || !character) return;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    intro.classList.add('is-in');
    character.classList.add('is-idle');
    return;
  }

  requestAnimationFrame(function () {
    intro.classList.add('is-in');
    character.classList.add('is-walking');
  });

  setTimeout(function () {
    character.classList.remove('is-walking');
    character.classList.add('is-waving');
  }, 1650);

  setTimeout(function () {
    character.classList.remove('is-waving');
    character.classList.add('is-idle');
  }, 3150);
})();
</script>
</body>
</html>
